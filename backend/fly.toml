# fly.toml app configuration file generated for nexora-vpn-api on 2026-11-19T01:36:50Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nexora-vpn-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'npm run migrate'

[env]
  DATABASE_SSL = 'true'
  DATABASE_SSL_REJECT_UNAUTHORIZED = 'true'
  ENFORCE_HTTPS = 'true'
  GOOGLE_PLAY_PACKAGE_NAME = 'com.aistudio.nexoravpn.nxrk7q'
  NODE_ENV = 'production'
  PORT = '4000'
  TRUST_PROXY = 'true'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
