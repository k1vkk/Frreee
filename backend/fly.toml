app = "nexora-vpn-api"
primary_region = "dxb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  TRUST_PROXY = "true"
  ENFORCE_HTTPS = "true"
  DATABASE_SSL = "true"
  GOOGLE_PLAY_PACKAGE_NAME = "com.aistudio.nexoravpn.nxrk7q"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"
