services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora_vpn
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed_gcc_topology.sql:/docker-entrypoint-initdb.d/02-seed-gcc.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_vpn"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: "true"
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-true}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?Set API_PUBLIC_URL in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set explicit HTTPS CORS_ORIGIN in .env (never "*")}
      DATABASE_URL: postgres://nexora:${POSTGRES_PASSWORD}@postgres:5432/nexora_vpn
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      NODE_AGENT_SECRET: ${NODE_AGENT_SECRET:?Set NODE_AGENT_SECRET in .env}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.aistudio.nexoravpn.nxrk7q}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN (e.g. api.yourdomain.com) in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
