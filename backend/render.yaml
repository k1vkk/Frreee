# Render Blueprint for NEXORA VPN Backend (set Service Root Directory = backend when linking repo)
services:
  - type: web
    name: nexora-vpn-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    preDeployCommand: npm run migrate
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: "true"
      - key: ENFORCE_HTTPS
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: NODE_AGENT_SECRET
        generateValue: true
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.aistudio.nexoravpn.nxrk7q

